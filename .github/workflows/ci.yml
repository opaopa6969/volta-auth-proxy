name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volta_auth_test
          POSTGRES_USER: volta
          POSTGRES_PASSWORD: volta
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # #50: fork からの PR には secrets が渡らない（GitHub の仕様）。
      # tramli 等の unlaxer artifact は private Nexus にしか無いため、
      # そのまま走らせると「依存が解決できない」という無関係な失敗になる。
      # fork PR では skip し、理由を明示する（案c）。
      # 恒久策は Nexus の anonymous read 開放（案a）か Maven Central 公開（案b）。
      - name: Check Nexus availability
        id: nexus
        run: |
          if [ -n "${{ secrets.NEXUS_USERNAME }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nexus credentials are not available (fork PR?). Skipping compile/test — a maintainer must re-run this from a branch in this repository."
          fi

      - name: Compile
        if: steps.nexus.outputs.available == 'true'
        run: mvn compile -q --settings .mvn/settings.xml
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Test
        if: steps.nexus.outputs.available == 'true'
        run: mvn test -q --settings .mvn/settings.xml
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: volta_auth_test
          DB_USER: volta
          DB_PASSWORD: volta
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
